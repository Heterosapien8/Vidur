<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidur</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-card">
    <header class="header">
      <div class="logo-container">
        <div class="logo-icon">V</div>
        <div>
          <h1 class="title">Vidur</h1>
          <span class="version">v1.0.0</span>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="description-box">
        <p class="desc-text">Ready to capture and analyze tab content.</p>
      </div>

      <button id="captureBtn" class="capture-button" type="button">
        <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        <span>Capture Screen</span>
      </button>

      <div id="status" class="status-container" style="display: none;">
        <span class="status-dot"></span>
        <span id="statusText" class="status-text"></span>
      </div>
    </main>

    <footer class="footer">
      <span class="footer-note">Vidur AI Monorepo</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
