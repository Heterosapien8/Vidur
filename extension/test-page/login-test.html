<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidur Test Page - Login Portal</title>
  <style>
    :root {
      --bg: #ffbae8;
      --card-bg: #ffffff;
      --text: #000000;
      --text-muted: #333333;
      --btn-bg: #000000;
      --btn-text: #F5E6FA;
      --border: 2px solid #000000;
      --shadow-flat: 4px 4px 0px #000000;
      --font-main: Georgia, 'Times New Roman', Times, serif;
      --font-ui: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-card {
      background-color: var(--card-bg);
      border: var(--border);
      box-shadow: var(--shadow-flat);
      padding: 36px;
      width: 100%;
      max-width: 420px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
      border-bottom: 2px solid #000000;
      padding-bottom: 16px;
    }

    .auth-badge {
      display: inline-block;
      font-family: var(--font-ui);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background-color: #000000;
      color: var(--btn-text);
      padding: 3px 8px;
      margin-bottom: 8px;
    }

    .auth-title {
      font-family: var(--font-main);
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text);
    }

    .auth-subtitle {
      font-family: var(--font-main);
      font-size: 13px;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
      color: var(--text);
    }

    input[type="email"],
    input[type="password"],
    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      background-color: #ffffff;
      border: 1.5px solid #000000;
      color: #000000;
      font-family: var(--font-main);
      font-size: 14px;
      outline: none;
      transition: box-shadow 0.15s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      box-shadow: 2px 2px 0px #000000;
      border-color: #000000;
    }

    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      font-size: 12px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      margin-bottom: 0;
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 600;
      text-transform: none;
      color: var(--text);
    }

    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #000000;
    }

    .forgot-link {
      font-family: var(--font-ui);
      color: #000000;
      text-decoration: underline;
      font-size: 11px;
      font-weight: 600;
    }

    .forgot-link:hover {
      background-color: #ffbae8;
    }

    /* Submit Button: Solid flat Black, Font #F5E6FA, NO GRADIENTS */
    .submit-btn {
      width: 100%;
      padding: 12px;
      background-color: var(--btn-bg);
      background-image: none !important;
      color: var(--btn-text);
      border: 2px solid #000000;
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 3px 3px 0px #000000;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .submit-btn:hover {
      background-color: #1a1a1a;
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #000000;
    }

    .submit-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0px #000000;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: var(--text-muted);
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 700;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #000000;
    }

    .divider span {
      padding: 0 10px;
    }

    .oauth-btn {
      width: 100%;
      padding: 10px;
      background-color: #ffffff;
      background-image: none !important;
      border: 1.5px solid #000000;
      color: #000000;
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000000;
      transition: background 0.15s;
    }

    .oauth-btn:hover {
      background-color: #ffbae8;
    }

    .signup-footer {
      text-align: center;
      margin-top: 24px;
      font-family: var(--font-main);
      font-size: 13px;
      color: var(--text);
      border-top: 1px solid #e5e5e5;
      padding-top: 16px;
    }

    .signup-footer a {
      font-family: var(--font-ui);
      color: #000000;
      text-decoration: underline;
      font-weight: 700;
      margin-left: 4px;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-badge">PORTAL AUTH</div>
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Sign in to test the Vidur Capture Layer</p>
    </div>

    <form id="loginForm" onsubmit="event.preventDefault(); alert('Form submitted!');">
      <!-- Email Field -->
      <div class="form-group">
        <label for="emailInput">Email Address</label>
        <input
          type="email"
          id="emailInput"
          name="email"
          autocomplete="email"
          placeholder="developer@vidur.ai"
          value="developer@vidur.ai"
          required
        />
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="passwordInput">Password</label>
        <input
          type="password"
          id="passwordInput"
          name="password"
          autocomplete="current-password"
          placeholder="Password"
          value="SuperSecret123!"
          required
        />
      </div>

      <!-- Role Select -->
      <div class="form-group">
        <label for="workspaceRole">Workspace Role</label>
        <select id="workspaceRole" name="role">
          <option value="admin">Administrator</option>
          <option value="developer" selected>Developer</option>
          <option value="viewer">Viewer</option>
        </select>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="form-row">
        <label class="checkbox-label" for="rememberMe">
          <input type="checkbox" id="rememberMe" name="remember" checked />
          <span>Remember this browser</span>
        </label>
        <a href="#forgot" class="forgot-link">Forgot Password?</a>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn" id="signInBtn">
        Sign In to Vidur
      </button>

      <div class="divider">
        <span>OR</span>
      </div>

      <!-- OAuth Button with aria-label -->
      <button type="button" class="oauth-btn" id="googleAuthBtn" aria-label="Sign in with Google Account">
        <span>Continue with Google</span>
      </button>
    </form>

    <div class="signup-footer">
      <span>Don't have an account?</span>
      <a href="#signup" id="createAccountLink">Create one now</a>
    </div>
  </div>
</body>
</html>
